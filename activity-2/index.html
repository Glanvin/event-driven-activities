<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 2:  Changing HTML Contents </title>
    <style>
    	table, th, tr, td {
    		border: 2px black solid;
    		text-align: center;
    	}
    	.cell {
    		color: white;
    	}
    </style>
</head>
<body>
	<table id="table" class="table">
		<th colspan="6">MY SCHEDULE</th>
		<tr>
			<td>DAYS</td>
			<td>7:30 - 9:00</td>
			<td>9:00 - 11:00</td>
			<td>11:00 - 12:00</td>
			<td>12:00 - 1:00</td>
			<td>2:00 - 4:00</td>
		</tr>
		<tr>
			<td>Monday</td>
			<td colspan="2" class="cs4">CS4</td>
			<td></td>
			<td rowspan="6" id="lunch">LUNCH <br> BREAK</td>
			<td rowspan="3" class="it101">IT 101</td>
		</tr>
		<tr>
			<td>Tuesday</td>
			<td></td>
			<td colspan="2" class="it101">IT 101</td>
		</tr>
		<tr>
			<td>Wednesday</td>
			<td class="gec">GEC 3</td>
			<td class="gec">GEC 4</td>
			<td rowspan="2" class="gec">GEC 5</td>
		</tr>
		<tr>
			<td>Thursday</td>
			<td></td>
			<td></td>
			<td></td>
		</tr>
		<tr>
			<td>Friday</td>
			<td colspan="3" class="cs4">CS4</td>
			<td rowspan="2" class="it103">IT 103</td>
		</tr>
		<tr>
			<td>Saturday</td>
			<td></td>
			<td colspan="2" class="it103">IT 103</td>
		</tr>
	</table>
<script src="main.js"></script>
</body>
</html>
